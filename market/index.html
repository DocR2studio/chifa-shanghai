function rl(){document.getElementById('list').innerHTML=P.map(function(p,i){if(cur!='Todo'&&p.c!=cur)return '';return '<div class="card"><div class="ph"><img loading="lazy" src="'+im(p.img)+'" alt="'+e(p.n)+'"></div><div class="bd"><span class="tag">'+e(p.c)+'</span><b>'+e(p.n)+'</b><span class="zh">'+e(p.zh)+'</span><span class="ds">'+e(p.d)+'</span><span class="cons">Consultar disponibilidad<small>Escríbenos o acércate al local</small></span><div class="row"><button class="det" type="button" onclick="op('+i+')">Detalles</button></div></div></div>'}).join('')}
function op(i){var p=P[i];document.getElementById('mi').src=im(p.img);document.getElementById('mi').alt=p.n;document.getElementById('mb').innerHTML='<span class="tag">'+e(p.c)+'</span><h1>'+e(p.n)+'</h1><span class="zh">'+e(p.zh)+'</span><p>'+e(p.t)+'</p><h3>Detalles</h3><ul class="specs">'+p.s.map(function(r){return '<li><span>'+e(r[0])+'</span>'+e(r[1])+'</li>'}).join('')+'</ul><div class="av cons">Consultar disponibilidad<small>Escríbenos o acércate al local</small></div>';document.getElementById('mdl').classList.add('on');document.body.style.overflow='hidden'}
function cl(){document.getElementById('mdl').classList.remove('on');document.body.style.overflow=''}
document.getElementById('mdl').onclick=function(ev){if(ev.target.id=='mdl')cl()};
rc();rl();

document.querySelector('.bk').onclick=function(){location.href='../#inicio'}</script>
</body></html>
